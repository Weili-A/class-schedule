<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a6cf7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="课程表">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="支持单双周、限周课程的个人课程表：显示每节课时间与地点，离线可用，数据仅存本机">
  <title>我的课程表</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="app-title">📅 我的课程表</div>
        <div class="app-sub" id="semester-status">—</div>
      </div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
  </header>

  <main id="main">

    <!-- ============ 今天 ============ -->
    <section id="view-today" class="view is-active">
      <div class="card next-card" id="next-card"></div>
      <div class="card">
        <div class="card-head">
          <div class="card-title" id="today-title">今天的课</div>
          <div class="card-badge" id="today-badge"></div>
        </div>
        <div id="today-list"></div>
      </div>
    </section>

    <!-- ============ 周课表 ============ -->
    <section id="view-week" class="view">
      <div class="week-nav card">
        <button class="nav-btn" id="week-prev" aria-label="上一周">‹</button>
        <div class="week-title-wrap">
          <div class="week-title" id="week-title">—</div>
          <div class="week-range" id="week-range"></div>
        </div>
        <button class="nav-btn" id="week-next" aria-label="下一周">›</button>
      </div>
      <button class="btn btn-block" id="week-today-btn" hidden>← 回到本周</button>
      <div id="week-grid"></div>
    </section>

    <!-- ============ 课程 ============ -->
    <section id="view-courses" class="view">
      <div class="view-head">
        <h2>全部课程</h2>
        <button class="btn btn-primary" id="course-add">＋ 添加课程</button>
      </div>
      <div id="course-list"></div>
      <p class="hint" id="course-hint">按“第几周”自动过滤：单周=第1、3、5…周；双周=第2、4、6…周。
        “只上 4 个周”这类课程用起止周表示，如“第1-4周”。</p>
    </section>

    <!-- ============ 设置 ============ -->
    <section id="view-settings" class="view">
      <h2 class="section-h">学期</h2>
      <div class="card form-card">
        <label class="field">
          <span>学期开始日期（第1周所在周的任意一天）</span>
          <input type="date" id="set-semester-start">
        </label>
        <label class="field">
          <span>学期总周数</span>
          <input type="number" id="set-total-weeks" min="1" max="40" step="1">
        </label>
        <label class="check-line">
          <input type="checkbox" id="set-first-week-odd"> 第1周为单周（一般保持勾选）
        </label>
        <div class="preview-line" id="set-preview"></div>
        <button class="btn" id="set-calibrate">🎯 校准：告诉我今天是第几周</button>
      </div>

      <h2 class="section-h">调休 / 停课</h2>
      <div class="card">
        <div id="override-list"></div>
        <button class="btn" id="override-add">＋ 添加调休或停课</button>
      </div>

      <h2 class="section-h">数据</h2>
      <div class="card btn-col">
        <button class="btn" id="data-export">⬇️ 导出备份（JSON 文件）</button>
        <button class="btn" id="data-export-copy">📋 复制备份文本</button>
        <button class="btn" id="data-import">⬆️ 导入备份（JSON）</button>
        <input type="file" id="data-import-file" accept=".json,application/json,text/plain" hidden>
        <label class="field" style="margin-top:6px">
          <span>日历提醒：课前几分钟</span>
          <select id="ics-alarm">
            <option value="5">5 分钟</option>
            <option value="10">10 分钟</option>
            <option value="15" selected>15 分钟（默认）</option>
            <option value="30">30 分钟</option>
            <option value="60">60 分钟</option>
          </select>
        </label>
        <button class="btn" id="data-ics">📆 导出到苹果日历（.ics，含课前提醒）</button>
        <button class="btn" id="data-demo">🧪 载入示例课程表（覆盖现有课程）</button>
        <button class="btn btn-danger" id="data-clear">🗑 清空所有数据</button>
      </div>

      <h2 class="section-h">帮助与隐私</h2>
      <div class="card help-card" id="help-box"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab is-active" data-view="today">今天</button>
    <button class="tab" data-view="week">周课表</button>
    <button class="tab" data-view="courses">课程</button>
    <button class="tab" data-view="settings">设置</button>
  </nav>

  <div id="modal-root" hidden></div>
  <div id="toast" hidden></div>

  <script src="./schedule-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
